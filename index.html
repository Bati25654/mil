<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mill Manager — মিল ম্যানেজার</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#e8ebf2; --text:#2b3445; --dim:#8b95a8;
    --blue:#2563eb; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
    --sd: rgba(163,177,198,0.6); --sl: rgba(255,255,255,0.9);
  }
  body { font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:90px; }
  .emb { background:var(--bg); border-radius:20px; box-shadow:7px 7px 14px var(--sd), -7px -7px 14px var(--sl); }
  .lbtn {
    font-family:inherit; font-size:14px; color:var(--text);
    background:linear-gradient(145deg,#f6f8fb,#e4e8ef); border:1px solid rgba(255,255,255,0.7);
    border-radius:16px; padding:11px 20px; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:5px 5px 12px var(--sd), -5px -5px 12px var(--sl), inset 0 1px 0 rgba(255,255,255,0.9);
    transition:transform .18s, box-shadow .18s;
  }
  .lbtn:hover { transform:translateY(-2px); }
  .lbtn:active { box-shadow:inset 4px 4px 8px var(--sd), inset -4px -4px 8px var(--sl); transform:translateY(0); }
  .lbtn::after { content:''; position:absolute; top:0; left:-80%; width:50%; height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,0.65),transparent); transform:skewX(-20deg); transition:left .5s; }
  .lbtn:hover::after { left:130%; }
  .lbtn.primary { background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff; border:none; font-weight:700;
    box-shadow:5px 5px 14px rgba(37,99,235,0.4), -5px -5px 12px var(--sl), inset 0 1px 0 rgba(255,255,255,0.35); }
  .lbtn.danger { background:linear-gradient(145deg,#f87171,#dc2626); color:#fff; border:none; font-weight:600; }
  .lbtn.small { padding:6px 13px; font-size:12.5px; border-radius:12px; }
  .lbtn.toggle { border-radius:30px; padding:9px 18px; font-weight:600; }
  .lbtn.toggle.on { background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff;
    box-shadow:inset 3px 3px 7px rgba(29,78,216,0.55), inset -2px -2px 6px rgba(96,165,250,0.4), 0 3px 10px rgba(37,99,235,0.3); }
  .lbtn.toggle.locked { opacity:.45; cursor:not-allowed; transform:none; }
  .lbtn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
  .loginwrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .loginbox { max-width:390px; width:100%; padding:34px 30px; text-align:center; border-radius:28px; }
  .orb { width:74px; height:74px; margin:0 auto 14px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px;
    background:var(--bg); box-shadow:6px 6px 12px var(--sd), -6px -6px 12px var(--sl); }
  .loginbox h2 { font-size:24px; margin-bottom:4px; }
  .loginbox .sub { font-size:13px; color:var(--dim); margin-bottom:22px; }
  .fgroup { position:relative; margin-bottom:16px; text-align:left; }
  .fgroup label { position:absolute; top:-8px; left:14px; font-size:11px; font-weight:700; color:var(--blue); background:var(--bg); padding:0 7px; border-radius:8px; z-index:2; }
  .fgroup input { width:100%; border:none; outline:none; font-family:inherit; font-size:14.5px; color:var(--text);
    background:var(--bg); border-radius:14px; padding:14px 16px;
    box-shadow:inset 5px 5px 9px var(--sd), inset -5px -5px 9px var(--sl); }
  .fgroup input:focus { box-shadow:inset 5px 5px 9px var(--sd), inset -5px -5px 9px var(--sl), 0 0 0 2px rgba(37,99,235,0.35); }
  .loginbox .lbtn { width:100%; padding:14px; margin-top:6px; }
  header { padding:20px 18px 6px; display:flex; align-items:center; gap:12px; }
  .avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px;
    box-shadow:4px 4px 10px var(--sd), -4px -4px 10px var(--sl); }
  .greet h1 { font-size:21px; }
  .greet .sub { font-size:12.5px; color:var(--dim); }
  .hbtns { margin-left:auto; display:flex; gap:8px; }
  nav { display:flex; gap:10px; padding:14px 18px; flex-wrap:wrap; }
  nav .lbtn.on { background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff; font-weight:700; }
  main { padding:4px 18px; max-width:960px; }
  .card { padding:18px; margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  input, select, textarea { font-family:inherit; font-size:14px; color:var(--text); border:none; outline:none;
    background:var(--bg); border-radius:12px; padding:10px 14px;
    box-shadow:inset 4px 4px 8px var(--sd), inset -4px -4px 8px var(--sl); }
  input:focus, select:focus, textarea:focus { box-shadow:inset 4px 4px 8px var(--sd), inset -4px -4px 8px var(--sl), 0 0 0 2px rgba(37,99,235,0.3); }
  input::placeholder, textarea::placeholder { color:var(--dim); }
  input[type=number]{ width:92px; }
  .hero { padding:22px; margin-bottom:16px; border-radius:24px; color:#fff; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8 70%,#1e40af);
    box-shadow:10px 10px 26px rgba(37,99,235,0.35), -6px -6px 16px var(--sl), inset 0 1px 0 rgba(255,255,255,0.3); }
  .hero.locked-hero { background:linear-gradient(135deg,#f59e0b,#d97706 70%,#b45309); box-shadow:10px 10px 26px rgba(217,119,6,0.35), -6px -6px 16px var(--sl); }
  .hero::before { content:''; position:absolute; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,0.14); filter:blur(55px); top:-110px; right:-50px; }
  .hero h2 { font-size:21px; position:relative; }
  .hero .em { font-style:italic; font-family:Georgia,serif; background:rgba(255,255,255,0.2); padding:0 9px; border-radius:8px; }
  .hero .hsub { font-size:12.5px; color:rgba(255,255,255,0.85); margin-top:3px; position:relative; }
  .hero .stats-mini { display:flex; gap:22px; margin-top:15px; position:relative; flex-wrap:wrap; }
  .hero .stats-mini b { display:block; font-size:17px; }
  .hero .stats-mini span { font-size:11px; color:rgba(255,255,255,0.75); }
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:14px; margin-bottom:16px; }
  .statcard { padding:16px; transition:.22s; }
  .statcard:hover { transform:translateY(-4px); }
  .statcard .ic { font-size:20px; }
  .statcard .val { font-size:22px; font-weight:800; margin:6px 0 2px; color:#1d4ed8; }
  .statcard .lbl { font-size:12px; color:var(--dim); }
  .chartwrap { overflow-x:auto; }
  table.mill { width:100%; border-collapse:collapse; margin-top:12px; font-size:12.5px; min-width:520px; }
  .mill th,.mill td { border:2px solid #b9c2d4; padding:6px 7px; text-align:center; white-space:nowrap; }
  .mill th { background:linear-gradient(145deg,#f2f5fa,#e2e7f0); font-weight:700; }
  .mill td.day { font-weight:700; background:linear-gradient(145deg,#eef1f7,#e4e9f1); width:38px; }
  .mill td.today { outline:2px solid #3b82f6; outline-offset:-2px; }
  .mill .tot { font-weight:800; color:#1d4ed8; background:linear-gradient(145deg,#eef1f7,#e4e9f1); }
  .gcell { color:#b45309; font-weight:700; }
  .name { font-weight:700; min-width:70px; }
  .small,.hint { font-size:12px; color:var(--dim); }
  .hint { margin-top:6px; line-height:1.8; }
  .tag { display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; background:var(--bg);
    box-shadow:3px 3px 6px var(--sd), -3px -3px 6px var(--sl); }
  .tag.mgr { background:linear-gradient(145deg,#3b82f6,#1d4ed8); color:#fff; }
  .tag.gst { color:#b45309; font-weight:700; }
  .personrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #d5dbe7; flex-wrap:wrap; }
  .personrow:last-child { border-bottom:none; }
  table.plain { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .plain th,.plain td { padding:7px 9px; text-align:center; border-bottom:1px solid #d5dbe7; }
  .plain th { color:var(--dim); font-weight:600; text-align:left; }
  .plain td.l,.plain th.l { text-align:left; }
  .b { color:#1d4ed8; font-weight:800; } .g { color:var(--green); font-weight:700; } .r { color:var(--red); font-weight:700; } .a { color:#b45309; font-weight:700; }
  .statline { display:inline-block; margin:4px 12px 4px 0; }
  .statline b { font-size:16px; color:#1d4ed8; }
  .hidden { display:none !important; }
  .toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); padding:11px 22px; border-radius:16px; z-index:99; opacity:0; transition:.3s; pointer-events:none; font-size:14px; font-weight:600; }
  .toast.show { opacity:1; }
  .bottombar { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg); border-radius:22px 22px 0 0; box-shadow:0 -6px 18px var(--sd); z-index:40; }
  .bottombar button { font-family:inherit; background:none; border:none; color:var(--dim); font-size:10.5px; cursor:pointer;
    padding:7px 11px; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:2px; font-weight:600; }
  .bottombar button .bi { font-size:19px; }
  .bottombar button.active { color:#1d4ed8; box-shadow:inset 3px 3px 7px var(--sd), inset -3px -3px 7px var(--sl); }
  @media(max-width:640px){ nav{display:none;} }

  /* Print Styles */
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .bottombar, header nav, .hbtns, .lbtn, .no-print { display: none !important; }
    .emb { box-shadow: none !important; border: 1px solid #ccc; background: #fff !important; }
    .hero { background: #2563eb !important; color: #fff !important; box-shadow: none !important; }
  }
</style>
</head>
<body>

<div id="loginView" class="loginwrap">
  <div class="emb loginbox">
    <div class="orb">✨</div>
    <h2 id="loginTitle">স্বাগতম</h2>
    <div class="sub" id="loginSub">মিল ম্যানেজারে লগইন করুন</div>
    <div id="setupView" class="hidden">
      <div class="fgroup"><label>ম্যানেজারের নাম</label><input id="suName" placeholder="আপনার নাম"></div>
      <div class="fgroup"><label>পাসওয়ার্ড</label><input id="suPass" type="password" placeholder="৪+ অক্ষর"></div>
      <div class="fgroup"><label>পাসওয়ার্ড আবার</label><input id="suPass2" type="password" placeholder="মিলিয়ে দিন"></div>
      <button class="lbtn primary" onclick="doSetup()">⚙️ ম্যানেজার সেটআপ</button>
    </div>
    <div id="loginForm">
      <div class="fgroup"><label>নাম</label><input id="liName" placeholder="আপনার নাম" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="fgroup"><label>পাসওয়ার্ড</label><input id="liPass" type="password" placeholder="পাসওয়ার্ড" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="lbtn primary" onclick="doLogin()">লগইন করুন →</button>
    </div>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="avatar" id="avatar"></div>
    <div class="greet">
      <h1 id="greetTxt"></h1>
      <div class="sub" id="greetSub"></div>
    </div>
    <div class="hbtns"><button class="lbtn small" onclick="logout()">লগআউট</button></div>
  </header>
  <nav id="navTabs"></nav>
  <main id="mainArea"></main>
  <div class="bottombar" id="bottomBar"></div>
</div>

<div id="modalRoot"></div>
<div class="emb toast" id="toast"></div>

<script>
const SHIFTS=['সকাল','দুপুর','রাত'];
const DEADLINE_HOUR=17;
const BLOCK_DAYS=4;
const TABS=[['d','📊 ড্যাশবোর্ড','📊','ড্যাশ'],['m','🍛 মিল','🍛','মিল'],['c','📋 চার্ট','📋','চার্ট'],['b','🛒 বাজার ও ক্যাটাগরি','🛒','বাজার'],['r','💰 টাকা','💰','টাকা'],['n','📌 নোটিশ ও ডিরেক্টরি','📌','নোটিশ'],['p','📅 রিপোর্ট','📅','রিপোর্ট'],['a','⚙️ ম্যানেজার','⚙️','অ্যাডমিন']];
let S=load(), me=null, curDate=new Date(), tab='d', bazarMonth=null;

function load(){
  const base={manager:null,users:{},people:[],meals:{},guests:{},bazars:[],advances:[],offDays:{},rotationExtra:[],rent:{},notices:[],checklist:[],profiles:{}};
  try{ return Object.assign(base,JSON.parse(localStorage.getItem('milApp5')||'{}')); }catch(e){ return base; }
}
function save(){ localStorage.setItem('milApp5',JSON.stringify(S)); }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>d.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const money=n=>'৳'+(Math.round(n)).toLocaleString('bn-BD');
const isMgr=()=>me&&me.isManager;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function greet(){const h=new Date().getHours();return h<12?'শুভ সকাল':h<16?'শুভ দুপুর':h<19?'শুভ বিকেল':'শুভ সন্ধ্যা';}

function isToday(k){ return k===dkey(new Date()); }
function entryLocked(k){
  if(!isToday(k)) return true;
  return new Date().getHours()>=DEADLINE_HOUR;
}
function lockMsg(k){
  if(!isToday(k)) return 'শুধু আজকের মিল এডিট করা যায়';
  return 'বিকাল ৫টা পার হয়েছে — আজকের মিল এন্ট্রি বন্ধ';
}

function doSetup(){
  const n=$('suName').value.trim(),p=$('suPass').value,p2=$('suPass2').value;
  if(!n)return toast('নাম দিন');
  if(p.length<4)return toast('পাসওয়ার্ড কমপক্ষে ৪ অক্ষর');
  if(p!==p2)return toast('দুইবার একই দিন');
  S.manager={name:n,pass:p}; S.people.push(n); S.profiles[n]={phone:'',room:''}; save(); login(n,true);
}
function doLogin(){
  const n=$('liName').value.trim(),p=$('liPass').value;
  if(!n)return toast('নাম দিন');
  if(S.manager&&n===S.manager.name){
    if(p===S.manager.pass)return login(n,true);
    return toast('ভুল ম্যানেজার পাসওয়ার্ড');
  }
  const u=S.users[n];
  if(u){ if(p===u.pass)return login(n,false); return toast('ভুল পাসওয়ার্ড'); }
  return toast('এই নামে অ্যাকাউন্ট নেই — ম্যানেজারকে বলুন');
}
function login(n,mgr){ me={name:n,isManager:mgr}; try{localStorage.setItem('milMe5',JSON.stringify({name:n}));}catch(e){} openApp(); }
function logout(){ me=null; try{localStorage.removeItem('milMe5');}catch(e){} location.reload(); }
try{ const mm=JSON.parse(localStorage.getItem('milMe5'));
  if(mm){ if(S.manager&&mm.name===S.manager.name) login(mm.name,true); else if(S.users[mm.name]) login(mm.name,false); }
}catch(e){}
if(!S.manager){ $('setupView').classList.remove('hidden'); $('loginForm').classList.add('hidden');
  $('loginTitle').textContent='শুরু করুন'; $('loginSub').textContent='প্রথমবার ম্যানেজার সেটআপ করুন'; }

function openApp(){ $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); renderNav(); go('d'); }
function renderNav(){
  const tabs=TABS.filter(t=>t[0]!=='a'||isMgr());
  $('navTabs').innerHTML=tabs.map(t=>`<button class="lbtn toggle ${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  $('bottomBar').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'active':''}" onclick="go('${t[0]}')"><span class="bi">${t[2]}</span>${t[3]}</button>`).join('');
  $('avatar').textContent=me.name[0];
  const k=dkey(new Date());
  $('greetTxt').textContent=greet()+', '+me.name+' 👋';
  $('greetSub').textContent=fmtD(new Date())+' · '+(entryLocked(k)?'🔒 আজকের এন্ট্রি বন্ধ':'⏰ এন্ট্রি চালু (বিকাল ৫টা পর্যন্ত)');
}
function go(t){ tab=t; renderNav(); render(); window.scrollTo(0,0); }

function getMeal(k,n){ return (S.meals[k]&&S.meals[k][n])||[false,false,false]; }
function cellStr(k,n){ return getMeal(k,n).map(v=>v?1:0).join('+'); }
function guestsOn(k,n){ return (S.guests[k]&&S.guests[k][n])||0; }
function guestNight(k,n){ return guestsOn(k,n); }
function guestMorning(k,n){
  const d=new Date(k+'T00:00:00'); d.setDate(d.getDate()-1);
  return guestsOn(dkey(d),n);
}
function mealCount(k,n){ return getMeal(k,n).filter(Boolean).length + guestNight(k,n) + guestMorning(k,n); }
function monthMeals(m){
  const t={}; S.people.forEach(p=>t[p]=0);
  for(const k in S.meals){ if(!k.startsWith(m))continue;
    for(const p in S.meals[k]) if(t[p]!==undefined) t[p]+=S.meals[k][p].filter(Boolean).length; }
  for(const k in S.guests){ if(!k.startsWith(m))continue;
    for(const p in S.guests[k]) if(t[p]!==undefined) t[p]+=S.guests[k][p]*2; }
  return t;
}
const byPm=(bs,p)=>bs.filter(b=>b.name===p).reduce((a,b)=>a+b.amount,0);

function rotationBase(){ return S.people.slice(); }
function bazarPerson(k){
  const ov=(S.rotationExtra||[]).find(o=>o.month===k.slice(0,7)&&k.slice(8)>=o.fromDay);
  if(ov) return ov.person;
  const order=rotationBase(); if(!order.length) return null;
  const day=parseInt(k.slice(8));
  const idx=Math.floor((day-1)/BLOCK_DAYS)%order.length;
  return order[idx];
}
function handover(k,person){
  const m=k.slice(0,7), day=k.slice(8);
  S.rotationExtra=(S.rotationExtra||[]).filter(o=>!(o.month===m&&o.fromDay===day));
  S.rotationExtra.push({month:m,fromDay:day,person}); save();
}

/* ═══ DASHBOARD ═══ */
function renderDash(){
  const k=dkey(curDate), m=k.slice(0,7);
  const locked=entryLocked(k);
  const bazars=S.bazars.filter(b=>b.date.startsWith(m));
  const rent=S.rent&&S.rent.month===m?(S.rent.amount||0):0;
  const totalCost=bazars.reduce((a,b)=>a+b.amount,0)+rent;
  const meals=monthMeals(m), totalMeals=Object.values(meals).reduce((a,b)=>a+b,0);
  const rate=totalMeals>0?totalCost/totalMeals:0;
  const todayTotal=S.people.reduce((a,p)=>a+mealCount(k,p),0);
  const bp=bazarPerson(k);
  
  // Latest 2 notices
  const latestNotices=(S.notices||[]).slice(-2).reverse();

  const hero=`
  <div class="hero ${locked?'locked-hero':''}">
    <h2>${locked?'🔒 আজকের এন্ট্রি বন্ধ':'আজ আপনার মিল'} ${locked?'':`— <span class="em">${cellStr(k,me.name)}</span>`}</h2>
    <div class="hsub">${fmtD(curDate)}${locked?' · বিকাল ৫টা পার হয়েছে':''}</div>
    <div class="stats-mini">
      <div><b>${todayTotal}</b><span>আজকের মোট মিল</span></div>
      <div><b>${S.people.length}</b><span>সদস্য</span></div>
      <div><b>${money(rate)}</b><span>মিল রেট</span></div>
      <div><b>${bp?esc(bp):'—'}</b><span>🛒 আজকের বাজারি</span></div>
    </div>
  </div>`;

  const noticeWidget=latestNotices.length?`

function toggleMeal(n,i){
  const k=dkey(curDate);
  if(entryLocked(k))return toast('🔒 '+lockMsg(k));
  S.meals[k]=S.meals[k]||{}; const a=getMeal(k,n); a[i]=!a[i]; S.meals[k][n]=a; save(); render();
}
function addGuest(n){
  const k=dkey(curDate);
  if(entryLocked(k))return toast('🔒 '+lockMsg(k));
  const v=prompt('কত জন মেহমান? (রাতের মিল + পরের দিন সকালের মিল ধরা হবে)','1');
  if(!v)return; const g=parseInt(v); if(!g||g<0)return toast('সঠিক সংখ্যা দিন');
  S.guests[k]=S.guests[k]||{}; S.guests[k][n]=(S.guests[k][n]||0)+g; save(); render();
}
function rmGuest(n){
  const k=dkey(curDate);
  if(entryLocked(k))return toast('🔒 '+lockMsg(k));
  if(!guestNight(k,n))return toast('মেহমান নেই');
  S.guests[k][n]=Math.max(0,S.guests[k][n]-1); save(); render();
}
function chDate(n){ curDate.setDate(curDate.getDate()+n); render(); }
function rmP(p){ if(!confirm(p+' কে বাদ দিবেন?'))return;
  S.people=S.people.filter(x=>x!==p); delete S.users[p]; delete S.profiles[p];
  for(const k in S.meals)delete S.meals[k][p]; for(const k in S.guests)delete S.guests[k][p];
  save(); render(); toast('বাদ দেওয়া হয়েছে'); }
function doHandover(k){
  const cur=bazarPerson(k);
  const others=S.people.filter(p=>p!==cur);
  const sel=prompt('আজ ('+k+') থেকে বাজার কাকে দিবেন?\n'+others.map((p,i)=>(i+1)+'. '+p).join('\n')+'\n\nনাম লিখুন:',others[0]||'');
  if(!sel)return;
  if(!S.people.includes(sel.trim()))return toast('এই নাম নেই');
  handover(k,sel.trim()); toast('হস্তান্তর হয়েছে: '+sel.trim()); render();
}

function renderChart(){
  const m=dkey(curDate).slice(0,7);
  const [y,mo]=m.split('-').map(Number);
  const last=new Date(y,mo,0).getDate();
  const todayK=dkey(new Date());
  let rows='';
  for(let d=1;d<=last;d++){
    const k=m+'-'+String(d).padStart(2,'0');
    const off=S.offDays[k]||[];
    let cells=S.people.map(p=>{
      const isOff=off.includes(p), c=mealCount(k,p);
      const gn=guestNight(k,p), gm=guestMorning(k,p);
      let txt=cellStr(k,p);
      if(gm)txt+=`<span class="gcell">+${gm}গ</span>`;
      if(gn)txt+=`<span class="gcell">+${gn}গ</span>`;
      if(isOff&&!c)txt='–';
      return `<td class="${k===todayK?'today':''}" style="${c?`background:rgba(37,99,235,${0.06+Math.min(0.25,c*0.08)})`:''}">${txt}</td>`;
    }).join('');
    const bp=bazarPerson(k);
    const dayTot=S.people.reduce((a,p)=>a+mealCount(k,p),0);
    rows+=`<tr><td class="day">${String(d).padStart(2,'0')}</td>${cells}<td class="tot">${dayTot||''}</td><td style="font-size:11px">${bp?esc(bp):''}</td></tr>`;
  }
  const meals=monthMeals(m);
  const months=[...new Set([...Object.keys(S.meals),dkey(curDate).slice(0,7)])].sort().reverse();
  return `
  <div class="emb card">
    <div class="row"><b>📋 মিল চার্ট — ${new Date(m+'-01').toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</b>
      <select style="margin-left:auto" onchange="curDate=new Date(this.value+'-15');render()">
        ${months.map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${new Date(mm+'-01').toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</option>`).join('')}
      </select>
    </div>
    <div class="chartwrap"><table class="mill">
      <tr><th></th>${S.people.map(p=>`<th>${esc(p)}</th>`).join('')}<th>মোট</th><th>বাজারি</th></tr>
      ${rows}
      <tr><th></th>${S.people.map(p=>`<th class="tot">${meals[p]}</th>`).join('')}<th class="tot">${Object.values(meals).reduce((a,b)=>a+b,0)}</th><th></th></tr>
    </table></div>
    <div class="hint">ফরম্যাট: <b>সকাল+দুপুর+রাত</b> (১=খেয়েছে, ০=খায়নি) · <span class="gcell">+১গ</span>= মেহমান · – = খাবে না</div>
  </div>`;

/* ═══ টাকা ═══ */
function renderMoney(){
  const m=dkey(curDate).slice(0,7);
  const bazars=S.bazars.filter(b=>b.date.startsWith(m));
  const rent=S.rent&&S.rent.month===m?(S.rent.amount||0):0;
  const totalCost=bazars.reduce((a,b)=>a+b.amount,0)+rent;
  const meals=monthMeals(m), totalMeals=Object.values(meals).reduce((a,b)=>a+b,0);
  const rate=totalMeals>0?totalCost/totalMeals:0;
  const adv=S.advances.filter(a=>a.month===m);
  const advBy={}; adv.forEach(a=>advBy[a.name]=(advBy[a.name]||0)+a.amount);
  const bal={};
  S.people.forEach(p=>{ bal[p]=byPm(bazars,p)+((S.rent&&S.rent.payer===p)?rent:0)+(advBy[p]||0)-meals[p]*rate; });
  const cred=S.people.map(p=>({p,v:bal[p]})).filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v);
  const debt=S.people.map(p=>({p,v:-bal[p]})).filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v);
  const pays=[]; let ci=0,di=0;
  while(ci<cred.length&&di<debt.length){
    const amt=Math.min(cred[ci].v,debt[di].v);
    if(amt>0.5)pays.push({from:debt[di].p,to:cred[ci].p,amt});
    cred[ci].v-=amt; debt[di].v-=amt;
    if(cred[ci].v<0.5)ci++; if(debt[di].v<0.5)di++;
  }
  return `
  <div class="emb card">
    <b>💰 মাসিক হিসাব — ${new Date(m+'-01').toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</b>
    <div style="margin-top:8px">
      <span class="statline">খরচ: <b>${money(totalCost)}</b></span>
      <span class="statline">মোট মিল: <b>${totalMeals}</b></span>
      <span class="statline">প্রতি মিল: <b>${money(rate)}</b></span>
    </div>
  </div>
  <div class="emb card">
    <b>🏠 ভাড়া / যৌথ খরচ</b>
    ${isMgr()?`<div class="row" style="margin-top:8px">
      <input id="rentA" type="number" placeholder="৳" value="${S.rent&&S.rent.month===m?S.rent.amount:''}">
      <select id="rentP">${S.people.map(p=>`<option ${S.rent&&S.rent.payer===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <button class="lbtn primary small" onclick="setRent()">সেভ</button>
    </div>`:`<div class="hint">ভাড়া: ${money(rent)} (${esc((S.rent&&S.rent.payer)||'-')} দিয়েছে)</div>`}
  </div>
  <div class="emb card">
    <b>💵 আগাম জমা</b>
    ${isMgr()?`<div class="row" style="margin-top:8px">
      <select id="advP">${S.people.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
      <input id="advA" type="number" placeholder="৳"><input id="advN" placeholder="নোট" style="width:110px">
      <button class="lbtn primary small" onclick="addAdv()">+ জমা</button>
    </div>`:''}
    ${adv.length?`<table class="plain"><tr><th class="l">নাম</th><th>৳</th><th class="l">নোট</th></tr>
    ${adv.map(a=>`<tr><td class="l">${esc(a.name)}</td><td class="g">${money(a.amount)}</td><td class="l">${esc(a.note||'')}</td></tr>`).join('')}</table>`:'<div class="hint">নেই</div>'}
  </div>
  <div class="emb card">
    <b>⚖️ ব্যালেন্স</b>
    <table class="plain"><tr><th class="l">নাম</th><th>মিল</th><th>খরচ</th><th>দিয়েছে</th><th>ব্যালেন্স</th></tr>
    ${S.people.map(p=>{
      const c=meals[p]*rate, paid=byPm(bazars,p)+((S.rent&&S.rent.payer===p)?rent:0)+(advBy[p]||0), b=paid-c;
      return `<tr><td class="l">${esc(p)}</td><td>${meals[p]}</td><td class="r">${money(c)}</td><td class="g">${money(paid)}</td>
        <td class="${b>=0?'g':'r'}">${b>=0?'+':'−'}${money(Math.abs(b))}</td></tr>`;
    }).join('')}</table>
    <div class="hint">➕ পাবে · ➖ দিতে হবে</div>
  </div>
  <div class="emb card">
    <b>🤝 কে কাকে দিবে</b>
    ${pays.length?`<table class="plain"><tr><th class="l">দিবে</th><th></th><th class="l">পাবে</th><th>৳</th></tr>
    ${pays.map(x=>`<tr><td class="l">${esc(x.from)}</td><td>→</td><td class="l">${esc(x.to)}</td><td class="b">${money(x.amt)}</td></tr>`).join('')}</table>`:'<div class="hint">সব ক্লিয়ার! 🎉</div>'}
  </div>
  <div class="emb card"><b>📤 শেয়ার / ব্যাকআপ</b>
    <div class="row" style="margin-top:8px">
      <button class="lbtn primary small" onclick="copyReport(${rate})">📋 হিসাব কপি</button>
      ${isMgr()?`<button class="lbtn small" onclick="exportJSON()">💾 ব্যাকআপ</button><button class="lbtn small" onclick="$('fileIn').click()">📥 রিস্টোর</button>`:''}
    </div>
    <input type="file" id="fileIn" class="hidden" accept=".json" onchange="doImport(this)">
  </div>`;
}
function setRent(){ const m=dkey(curDate).slice(0,7); S.rent={month:m,amount:parseFloat($('rentA').value)||0,payer:$('rentP').value}; save(); render(); }
function addAdv(){ const a=parseFloat($('advA').value); if(!a)return toast('টাকা দিন');
  S.advances.push({month:dkey(curDate).slice(0,7),name:$('advP').value,amount:a,note:$('advN').value.trim()}); save(); render(); }
function copyReport(rate){
  const m=dkey(curDate).slice(0,7), meals=monthMeals(m);
  const bazars=S.bazars.filter(b=>b.date.startsWith(m));
  const rent=S.rent&&S.rent.month===m?S.rent.amount:0;
  const total=bazars.reduce((a,b)=>a+b.amount,0)+rent;
  let txt=`🍚 মিলের হিসাব — ${new Date(m+'-01').toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}\n\n`;
  S.people.forEach(p=>txt+=`${p}: ${meals[p]} মিল → ${money(meals[p]*rate)}\n`);
  txt+=`\nমোট মিল: ${Object.values(meals).reduce((a,b)=>a+b,0)}\nমোট খরচ: ${money(total)}\nপ্রতি মিল: ${money(rate)}\n`;
  navigator.clipboard.writeText(txt).then(()=>toast('কপি হয়েছে!'));
}
function exportJSON(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})); a.download='mil-backup-'+dkey(new Date())+'.json'; a.click(); }
function doImport(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ S=JSON.parse(r.result); save(); toast('রিস্টোর হয়েছে'); render(); }catch(e){ toast('ভুল ফাইল'); } }; r.readAsText(f); }

/* ═══ নোটিশ বোর্ড ও ডিরেক্টরি (Feature 2 & Feature 6) ═══ */
function renderNotice(){
  const notices=S.notices||[];
  const profiles=S.profiles||{};
  return `
  <!-- Feature 2: Notice Board -->
  <div class="emb card">
    <b>📌 মেসের ডিজিটাল নোটিশ বোর্ড</b>
    <div style="margin-top:10px">
      <textarea id="noticeText" placeholder="জরুরি ঘোষণা লিখুন (যেমন: আজ রাতে বাজার ভালো করে করবে...)" style="width:100%;height:70px;padding:10px;resize:none"></textarea>
      <button class="lbtn primary small" style="margin-top:6px" onclick="addNotice()">নোটিশ পোস্ট করুন</button>
    </div>
    <div style="margin-top:14px">
      ${notices.length?notices.slice().reverse().map((n,i)=>`
        <div class="emb card" style="margin-bottom:10px;padding:12px;background:#f8fafc">
          <div class="row"><b>${esc(n.author)}</b><span class="small" style="margin-left:auto">${n.date}</span></div>
          <div style="margin-top:6px;font-size:14px;white-space:pre-wrap">${esc(n.text)}</div>
          ${(isMgr()||n.author===me.name)?`<button class="lbtn small danger" style="margin-top:8px" onclick="delNotice(${notices.length-1-i})">ডিলেট</button>`:''}
        </div>
      `).join(''):'<div class="hint">কোনো নোটিশ নেই</div>'}
    </div>
  </div>

  <!-- Feature 6: Member Directory -->
  <div class="emb card">
    <b>📞 সদস্য প্রোফাইল ও ফোন ডিরেক্টরি</b>
    <div class="hint" style="margin-bottom:10px">আপনার ফোন নম্বর ও রুম নম্বর আপডেট করুন যাতে সবাই যোগাযোগ করতে পারে।</div>
    <table class="plain"><tr><th class="l">নাম</th><th class="l">ফোন নম্বর</th><th class="l">রুম</th><th></th></tr>
    ${S.people.map(p=>{
      const prof=profiles[p]||{phone:'',room:''};
      const isMe=(p===me.name);
      return `<tr>
        <td class="l"><b>${esc(p)}</b></td>
        <td class="l">${isMe?`<input id="myPhone" value="${esc(prof.phone)}" placeholder="017xxxxxxxx" style="width:130px;padding:6px">`:(esc(prof.phone)||'–')}</td>
        <td class="l">${isMe?`<input id="myRoom" value="${esc(prof.room)}" placeholder="রুম নং" style="width:70px;padding:6px">`:(esc(prof.room)||'–')}</td>
        <td>${isMe?`<button class="lbtn primary small" onclick="saveProfile()">সেভ</button>`:(prof.phone?`<a href="tel:${prof.phone}" class="lbtn small primary" style="text-decoration:none">কল</a>`:``)}</td>
      </tr>`;
    }).join('')}</table>
  </div>`;
}
function addNotice(){
  const t=$('noticeText').value.trim(); if(!t)return;
  S.notices=S.notices||[];
  S.notices.push({text:t,author:me.name,date:new Date().toLocaleDateString('bn-BD')});
  save(); $('noticeText').value=''; render(); toast('নোটিশ পোস্ট হয়েছে');
}
function delNotice(i){ S.notices.splice(i,1); save(); render(); toast('ডিলিট হয়েছে'); }
function saveProfile(){
  const p=$('myPhone').value.trim(), r=$('myRoom').value.trim();
  S.profiles=S.profiles||{};
  S.profiles[me.name]={phone:p,room:r};
  save(); render(); toast('প্রোফাইল আপডেট হয়েছে');
}

/* ═══ রিপোর্ট ও প্রিন্ট (Feature 3) ═══ */
function renderReport(){
  const m=dkey(curDate).slice(0,7);
  const meals=monthMeals(m);
  const bazars=S.bazars.filter(b=>b.date.startsWith(m));
  const rent=S.rent&&S.rent.month===m?(S.rent.amount||0):0;
  const total=bazars.reduce((a,b)=>a+b.amount,0)+rent;
  const tm=Object.values(meals).reduce((a,b)=>a+b,0);
  const rate=tm>0?total/tm:0;
  return `
  <div class="emb card">
    <div class="row">
      <b>📅 মাসিক রিপোর্ট — ${new Date(m+'-01').toLocaleDateString('bn-BD',{month:'long',year:'numeric'})}</b>
      <button class="lbtn primary small no-print" style="margin-left:auto" onclick="window.print()">🖨️ প্রিন্ট / PDF সেভ</button>
    </div>
    <table class="plain" style="margin-top:10px"><tr><th class="l">নাম</th><th>মোট মিল</th><th>দিতে হবে</th></tr>
    ${S.people.map(p=>`<tr><td class="l">${esc(p)}</td><td><b>${meals[p]}</b></td><td class="b">${money(meals[p]*rate)}</td></tr>`).join('')}
    <tr><th class="l">মোট</th><th>${tm}</th><th>${money(total)}</th></tr></table>
    <div class="hint">প্রতি মিল রেট: ${money(rate)} · মেহমান ১ এন্ট্রি = ২ মিল</div>
  </div>`;
}

/* ═══ অ্যাডমিন ═══ */
function renderAdmin(){
  const order=rotationBase();
  return `
  <div class="emb card">
    <b>👥 ইউজার ম্যানেজমেন্ট</b>
    <div class="row" style="margin-top:12px">
      <input id="nuName" placeholder="নতুন ইউজারের নাম">
      <input id="nuPass" type="password" placeholder="পাসওয়ার্ড (৪+)" style="width:150px">
      <button class="lbtn primary small" onclick="addUser()">+ ইউজার যোগ</button>
    </div>
    <table class="plain" style="margin-top:12px"><tr><th class="l">নাম</th><th>রোল</th><th>পাসওয়ার্ড</th><th></th></tr>
    ${S.manager?`<tr><td class="l">${esc(S.manager.name)}</td><td><span class="tag mgr">ম্যানেজার</span></td><td>—</td><td></td></tr>`:''}
    ${S.people.filter(p=>!S.manager||p!==S.manager.name).map(p=>`<tr>
      <td class="l">${esc(p)}</td><td>ইউজার</td>
      <td>${S.users[p]?'✅':'❌'}</td>
      <td class="row" style="justify-content:center">
        <button class="lbtn small" onclick="resetPass('${esc(p)}')">🔑</button>
        <button class="lbtn small danger" onclick="rmP('${esc(p)}')">🗑️</button>
      </td></tr>`).join('')}
    </table>
  </div>
  <div class="emb card">
    <b>🔄 বাজার রোটেশন ক্রম</b>
    <div class="hint">মাসের ১ তারিখ থেকে এই ক্রমে প্রত্যেকে ${BLOCK_DAYS} দিন করে বাজার করবে।</div>
    <div class="row" style="margin-top:8px">
      ${order.map((p,i)=>`<span class="tag">${i+1}. ${esc(p)} (${i*BLOCK_DAYS+1}–${(i+1)*BLOCK_DAYS})</span>`).join(' → ')}
    </div>
  </div>
  <div class="emb card">
    <b>🗑️ ডেটা রিসেট</b>
    <div class="row" style="margin-top:8px">
      <button class="lbtn danger small" onclick="if(confirm('সব ডেটা মুছে নতুন শুরু?')){localStorage.removeItem('milApp5');localStorage.removeItem('milMe5');location.reload()}">সব রিসেট</button>
    </div>
  </div>`;
}
function addUser(){
  const n=$('nuName').value.trim(), p=$('nuPass').value;
  if(!n)return toast('নাম দিন');
  if(S.people.includes(n)||(S.manager&&n===S.manager.name))return toast('আছে আগেই');
  if(p&&p.length<4)return toast('পাসওয়ার্ড ৪+ অক্ষর');
  S.people.push(n); if(p)S.users[n]={pass:p}; S.profiles[n]={phone:'',room:''};
  save(); render(); toast(n+' যোগ হয়েছে');
}
function resetPass(p){
  const np=prompt('"'+p+'" এর নতুন পাসওয়ার্ড (৪+ অক্ষর):', S.users[p]?S.users[p].pass:'');
  if(np===null)return;
  if(np.length<4)return toast('৪+ অক্ষর');
  S.users[p]={pass:np}; save(); render(); toast('সেট হয়েছে');
}

function render(){
  $('mainArea').innerHTML = tab==='d'?renderDash() : tab==='m'?renderMeal() : tab==='c'?renderChart() : tab==='b'?renderBazar() : tab==='r'?renderMoney() : tab==='n'?renderNotice() : tab==='p'?renderReport() : renderAdmin();
}
setInterval(()=>{ if(me&&tab==='d'&&isToday(dkey(curDate))) render(); }, 60000);
</script>
</body>
</html>
